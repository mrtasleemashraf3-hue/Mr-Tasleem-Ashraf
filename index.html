<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasleem Smart Trading</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2638;
            --input-bg: #182030;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --primary-btn: #f59e0b;
            --primary-btn-hover: #d97706;
            --buy-btn: #10b981;
            --sell-btn: #ef4444;
            --border-color: #2e3a52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .trading-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .trade-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-trade {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: #fff;
        }

        .btn-buy { background-color: var(--buy-btn); }
        .btn-sell { background-color: var(--sell-btn); }

        .trade-status {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-btn);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .btn-action:hover {
            background-color: var(--primary-btn-hover);
        }

        .status-message {
            margin-top: 10px;
            font-size: 13px;
            color: #f59e0b;
            min-height: 20px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }
    </style>
</head>
<body>

    <div class="trading-card">
        <!-- Trade Actions -->
        <div class="trade-actions">
            <button class="btn-trade btn-buy">Buy / Long</button>
            <button class="btn-trade btn-sell">Sell / Short</button>
        </div>

        <div class="trade-status">Trade status...</div>

        <!-- Balance Section -->
        <div class="section-title">Balance</div>
        <div class="balance-amount" id="user-balance">$0.00</div>

        <!-- Deposit Section -->
        <div class="subtitle">Deposit (Crypto / Blockchain)</div>
        
        <div class="form-group">
            <input type="number" id="deposit-amount" class="form-control" placeholder="Amount in USD (min 10)" value="500">
        </div>

        <button class="btn-action" onclick="redirectToPayment()">Pay with crypto</button>
        <div class="status-message" id="deposit-status"></div>

        <div class="divider"></div>

        <!-- Withdraw Section -->
        <div class="subtitle">Withdraw</div>
        <div class="form-group">
            <select class="form-control">
                <option>USDT (TRC20)</option>
            </select>
        </div>
        <div class="form-group">
            <input type="text" class="form-control" placeholder="Your wallet address (e.g. TRC20)">
        </div>
        <div class="form-group">
            <input type="number" class="form-control" placeholder="Amount in USD (min 10)">
        </div>
        <button class="btn-action" type="button">Request withdrawal</button>
    </div>

    <script>
        function redirectToPayment() {
            const amountInput = document.getElementById("deposit-amount");
            const statusBox = document.getElementById("deposit-status");
            const amount = Number(amountInput.value);

            if (!amount || amount < 10) {
                alert("कृपया कम से कम $10 दर्ज करें।");
                return;
            }

            statusBox.innerText = "Redirecting to NOWPayments Checkout...";

            // NOWPayments Hosted Payment Redirect
            // नोट: अगर आपके पास NOWPayments का सीधा Payment Link है तो नीचे URL बदलें
            window.location.href = "https://nowpayments.io/payment/?iid=5000000000"; 
        }
    </script>
</body>
</html>
