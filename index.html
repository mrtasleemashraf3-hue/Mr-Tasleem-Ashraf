<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasleem Smart Trading</title>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2638;
            --input-bg: #182030;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --primary-btn: #f59e0b;
            --primary-btn-hover: #d97706;
            --buy-btn: #10b981;
            --sell-btn: #ef4444;
            --border-color: #2e3a52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .trading-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }

        .trade-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-trade {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: #fff;
        }

        .btn-buy { background-color: var(--buy-btn); }
        .btn-sell { background-color: var(--sell-btn); }

        .trade-status {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-btn);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .status-message {
            margin-top: 10px;
            font-size: 13px;
            color: #f59e0b;
            min-height: 20px;
            word-break: break-word;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }
    </style>
</head>
<body>

    <div class="trading-card">
        <div class="header-title">Quick Trade</div>

        <div class="form-group">
            <input type="number" class="form-control" placeholder="Amount in USD">
        </div>

        <div class="trade-actions">
            <button class="btn-trade btn-buy">Buy / Long</button>
            <button class="btn-trade btn-sell">Sell / Short</button>
        </div>

        <div class="trade-status">Trade status...</div>

        <div class="section-title">Balance</div>
        <div class="balance-amount" id="user-balance">$0.00</div>

        <div class="subtitle">Deposit (Crypto / Blockchain)</div>
        
        <div class="form-group">
            <label>Select Currency</label>
            <select id="deposit-currency" class="form-control">
                <option value="usdttrc20">USDT (TRC20)</option>
                <option value="btc">Bitcoin (BTC)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Deposit Amount ($ USD)</label>
            <input type="number" id="deposit-amount" class="form-control" placeholder="Amount in USD (min 10)" value="500" min="10" max="50000">
        </div>

        <button class="btn-action" id="pay-btn" onclick="handleCryptoDeposit()">Pay with crypto</button>
        <div class="status-message" id="deposit-status"></div>

        <div class="divider"></div>

        <div class="subtitle">Withdraw</div>
        <div class="form-group">
            <select class="form-control">
                <option>USDT (TRC20)</option>
                <option>Bitcoin (BTC)</option>
            </select>
        </div>
        <div class="form-group">
            <input type="text" class="form-control" placeholder="Your wallet address">
        </div>
        <div class="form-group">
            <input type="number" class="form-control" placeholder="Amount in USD (min 10)">
        </div>
        <button class="btn-action">Request withdrawal</button>
    </div>

    <script>
        // अपनी असली Supabase डिटेल्स यहाँ पेस्ट करें:
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleCryptoDeposit() {
            const amountInput = document.getElementById("deposit-amount");
            const currencySelect = document.getElementById("deposit-currency");
            const statusBox = document.getElementById("deposit-status");
            const payBtn = document.getElementById("pay-btn");

            const amount = Number(amountInput.value);
            const currency = currencySelect.value;

            if (!Number.isFinite(amount) || amount < 10 || amount > 50000) {
                alert("कृपया कम से कम $10 और अधिकतम $50,000 दर्ज करें।");
                if (statusBox) statusBox.innerText = "Invalid amount range.";
                return;
            }

            if (statusBox) statusBox.innerText = "Creating payment & blockchain invoice...";
            payBtn.disabled = true;

            try {
                const { data, error } = await sb.functions.invoke("create-deposit", {
                    body: { amount: amount, pay_currency: currency }
                });

                if (error) {
                    console.error("Supabase Error:", error);
                    alert("पेमेंट अनुरोध विफल हुआ। विवरण कंसोल में देखें।");
                    if (statusBox) statusBox.innerText = "Error: " + error.message;
                    payBtn.disabled = false;
                    return;
                }

                if (data && typeof data.invoice_url === "string" && data.invoice_url.startsWith("https://")) {
                    if (statusBox) statusBox.innerText = "Redirecting to NOWPayments...";
                    window.location.assign(data.invoice_url);
                } else {
                    alert("सर्वर से पेमेंट पेज का लिंक नहीं मिल पाया।");
                    if (statusBox) statusBox.innerText = "Invoice URL missing.";
                    payBtn.disabled = false;
                }
            } catch (err) {
                console.error("Error:", err);
                if (statusBox) statusBox.innerText = "Error: " + err.message;
                payBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
