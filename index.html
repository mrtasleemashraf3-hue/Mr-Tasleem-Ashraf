<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasleem Smart Trading</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #fff; --mut: #94a3b8; --accent: #d97706; }
    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: var(--accent); font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    .msg { font-size: 14px; margin-top: 5px; color: #38bdf8; }
    .section { margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Tasleem Smart Trading</h2>

    <!-- 1. लॉगिन सेक्शन -->
    <div id="login-section">
      <h3>Login</h3>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-button">Login</button>
        <p id="login-error" class="msg" style="color: #f87171;"></p>
      </form>
    </div>

    <!-- 2. ट्रेडिंग सेक्शन (Buy/Sell) -->
    <div class="section">
      <h3>Trading</h3>
      <select id="sym">
        <option value="BTC/USD">BTC/USD</option>
        <option value="ETH/USD">ETH/USD</option>
      </select>
      <input type="number" id="tradeAmt" placeholder="Trade Amount ($)">
      <button id="buyBtn">BUY</button>
      <button id="sellBtn">SELL</button>
      <div id="tmsg" class="msg"></div>
    </div>

    <!-- 3. डिपॉजिट सेक्शन -->
    <div class="section">
      <h3>Deposit</h3>
      <input type="number" id="amt" placeholder="Deposit Amount (Min $10)">
      <button id="dep">Deposit via Gateway</button>
      <div id="dmsg" class="msg"></div>
    </div>

    <!-- 4. विड्रॉल सेक्शन -->
    <div class="section">
      <h3>Withdrawal</h3>
      <input type="number" id="wamt" placeholder="Withdrawal Amount (Min $10)">
      <input type="text" id="waddr" placeholder="Wallet Address (Min 15 chars)">
      <select id="wcur">
        <option value="USDT">USDT</option>
        <option value="BTC">BTC</option>
      </select>
      <button id="wd">Request Withdrawal</button>
      <div id="wmsg" class="msg"></div>
    </div>

  </div>

  <script>
    // --- SUPABASE INITIALIZATION ---
    // (अपनी सही URL और Anon Key यहाँ डालें यदि कॉन्फ़िगर नहीं है)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // मैसेज दिखाने के लिए सहायक फंक्शन
    function say(elementId, text, isSuccess) {
      const el = document.getElementById(elementId);
      if (el) {
        el.style.color = isSuccess === true ? '#4ade80' : (isSuccess === false ? '#f87171' : '#38bdf8');
        el.textContent = text;
      }
    }

    // एरर हैंडलर फंक्शन
    async function fnError(err) {
      try {
        if (typeof err === 'string') return err;
        if (err.message) return err.message;
        return JSON.stringify(err);
      } catch(e) {
        return "Unknown error occurred";
      }
    }

    // बूट फंक्शन
    function boot() {
      console.log("App booted successfully");
    }

    // --- 1. लॉगिन फॉर्म हैंडलर ---
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('login-error');
        
        if (errorBox) errorBox.textContent = '';

        try {
          if (!sb) throw new Error("Supabase client not initialized");
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          
          window.location.href = 'dashboard.html'; 
        } catch (err) {
          console.error("Login error:", err);
          if (errorBox) {
            errorBox.textContent = err.message || 'लॉगिन विफल रहा।';
          } else {
            alert("लॉगिन विफल रहा: " + err.message);
          }
        }
      });
    }

    // --- 2. ट्रेडिंग बाय / सेल एक्शन फंक्शन्स ---
    const buyBtn = document.getElementById('buyBtn');
    if (buyBtn) {
      buyBtn.onclick = () => {
        const amt = parseFloat(document.getElementById('tradeAmt').value);
        if(!amt || amt <= 0){ say("tmsg","Enter a valid trade amount."); return; }
        say("tmsg", `Successfully opened BUY order for $${amt} on ${document.getElementById('sym').value}`, true);
        document.getElementById('tradeAmt').value = "";
      };
    }

    const sellBtn = document.getElementById('sellBtn');
    if (sellBtn) {
      sellBtn.onclick = () => {
        const amt = parseFloat(document.getElementById('tradeAmt').value);
        if(!amt || amt <= 0){ say("tmsg","Enter a valid trade amount."); return; }
        say("tmsg", `Successfully opened SELL order for $${amt} on ${document.getElementById('sym').value}`, false);
        document.getElementById('tradeAmt').value = "";
      };
    }

    // --- 3. डिपॉजिट फ़ंक्शन ---
    const depBtn = document.getElementById('dep');
    if (depBtn) {
      depBtn.onclick = async () => {
        const amount = parseFloat(document.getElementById('amt').value);
        if(!(amount >= 10)){ say("dmsg","Minimum deposit is $10."); return; }
        say("dmsg","Creating payment & blockchain invoice…", null);
        
        const { data, error } = await sb.functions.invoke("create-deposit", { body: { amount } });
        if (error || !data?.invoice_url) { 
          say("dmsg", error ? await fnError(error) : "Payment gateway error."); 
          return; 
        }
        location.href = data.invoice_url;
      };
    }

    // --- 4. विड्रॉल फ़ंक्शन ---
    const wdBtn = document.getElementById('wd');
    if (wdBtn) {
      wdBtn.onclick = async () => {
        const amount = parseFloat(document.getElementById('wamt').value);
        const address = document.getElementById('waddr').value.trim();
        const currency = document.getElementById('wcur').value;

        if(!(amount >= 10) || address.length < 15) { 
          say("wmsg","Enter a valid amount (min $10) and wallet address."); 
          return; 
        }
        say("wmsg","Sending withdrawal request to blockchain…", null);

        const { error } = await sb.functions.invoke("request-withdrawal", { body: { amount, address, currency } });
        if (error) { 
          say("wmsg", await fnError(error)); 
          return; 
        }
        
        say("wmsg","Withdrawal requested successfully. Hash will be tracked on blockchain.", true);
        document.getElementById('wamt').value = ""; 
        document.getElementById('waddr').value = ""; 
        if (typeof loadBalance === 'function') loadBalance();
      };
    }

    // --- 5. ऑथेंटिकेशन स्टेट चेंज मॉनिटर ---
    if (sb) {
      sb.auth.onAuthStateChange(() => { 
        if (typeof boot === 'function') boot(); 
      });
    }
  </script>
</body>
</html>
