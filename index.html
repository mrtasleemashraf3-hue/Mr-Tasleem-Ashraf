<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasleem Smart Trading</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2638;
            --input-bg: #182030;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --primary-btn: #f59e0b;
            --buy-btn: #10b981;
            --sell-btn: #ef4444;
            --border-color: #2e3a52;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .trading-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .trade-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-trade {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }

        .btn-buy { background-color: var(--buy-btn); }
        .btn-sell { background-color: var(--sell-btn); }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-btn);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="trading-card">
        <div class="trade-actions">
            <button class="btn-trade btn-buy">Buy / Long</button>
            <button class="btn-trade btn-sell">Sell / Short</button>
        </div>

        <div style="background: var(--input-bg); padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted);">Trade status...</div>

        <h3>Balance</h3>
        <h1 style="font-size: 32px; margin: 8px 0 20px 0;">$0.00</h1>

        <h4>Deposit (Crypto / Blockchain)</h4>
        <input type="number" id="deposit-amount" class="form-control" value="500" placeholder="Amount in USD (min 10)">
        <button class="btn-action" onclick="handleCryptoDeposit()">Pay with crypto</button>
        <div class="status-msg" id="deposit-status"></div>

        <hr style="border: 0.5px solid var(--border-color); margin: 24px 0;">

        <h4>Withdraw</h4>
        <select class="form-control">
            <option>USDT (TRC20)</option>
        </select>
        <input type="text" class="form-control" placeholder="Your wallet address (e.g. TRC20)">
        <input type="number" class="form-control" placeholder="Amount in USD (min 10)">
        <button class="btn-action">Request withdrawal</button>
    </div>

    <script>
        // Supabase Init
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleCryptoDeposit() {
            const amountInput = document.getElementById("deposit-amount");
            const statusBox = document.getElementById("deposit-status");
            const amount = Number(amountInput.value);

            if (!Number.isFinite(amount) || amount < 10 || amount > 50000) {
                alert("कृपया वैध राशि दर्ज करें (न्यूनतम $10 और अधिकतम $50,000)।");
                if (statusBox) statusBox.innerText = "Invalid amount.";
                return;
            }

            if (statusBox) statusBox.innerText = "Creating payment & blockchain invoice...";

            try {
                const { data, error } = await sb.functions.invoke("create-deposit", {
                    body: { amount }
                });

                if (error) {
                    console.error("create-deposit error:", error);
                    alert("डिपॉजिट अनुरोध विफल हुआ। विवरण के लिए कंसोल देखें।");
                    if (statusBox) statusBox.innerText = "Deposit failed.";
                    return;
                }

                if (typeof data?.invoice_url === "string" && data.invoice_url.startsWith("https://")) {
                    window.location.assign(data.invoice_url);
                } else {
                    console.error("Response:", data);
                    alert("इनवाइस यूआरएल नहीं मिल पाया।");
                    if (statusBox) statusBox.innerText = "Invoice URL missing.";
                }
            } catch (err) {
                console.error("Error:", err);
                if (statusBox) statusBox.innerText = "Error occurred.";
            }
        }
    </script>
</body>
</html>
